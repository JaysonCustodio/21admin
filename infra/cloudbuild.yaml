steps:
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/web:$SHORT_SHA", "-f", "apps/web/Dockerfile", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["build", "-t", "gcr.io/$PROJECT_ID/api:$SHORT_SHA", "-f", "apps/api/Dockerfile", "."]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/web:$SHORT_SHA"]
  - name: "gcr.io/cloud-builders/docker"
    args: ["push", "gcr.io/$PROJECT_ID/api:$SHORT_SHA"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args: ["run", "services", "update", "web", "--image", "gcr.io/$PROJECT_ID/web:$SHORT_SHA", "--region", "us-central1"]
  - name: "gcr.io/google.com/cloudsdktool/cloud-sdk"
    entrypoint: gcloud
    args: ["run", "services", "update", "api", "--image", "gcr.io/$PROJECT_ID/api:$SHORT_SHA", "--region", "us-central1"]

images:
  - "gcr.io/$PROJECT_ID/web:$SHORT_SHA"
  - "gcr.io/$PROJECT_ID/api:$SHORT_SHA"
